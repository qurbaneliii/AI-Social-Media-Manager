services:
  - type: web
    name: aria-ai-orchestration-mvp
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: aria/apps/llm-orchestration
    buildCommand: pip install -U pip && pip install -e .
    startCommand: PYTHONPATH=app uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_MOCK_MODE
        value: "false"
      - key: ARIA_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_TEMPERATURE
        value: "0.4"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: CORS_ORIGINS
        sync: false
