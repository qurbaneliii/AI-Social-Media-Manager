services:
  - type: web
    name: aria-llm-orchestration
    runtime: python
    plan: free
    region: oregon
    branch: deploy/mvp-vercel-render-supabase
    rootDir: aria/apps/llm-orchestration
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: PYTHONPATH=app uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_MOCK_MODE
        value: "true"
      - key: OPENAI_API_KEY
        value: replace-me
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_TEMPERATURE
        value: "0.4"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: CORS_ORIGINS
        sync: false
