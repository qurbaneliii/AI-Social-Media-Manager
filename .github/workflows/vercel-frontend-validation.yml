name: Validate Vercel Frontend

on:
  pull_request:
    paths:
      - "aria-frontend/**"
      - ".github/workflows/vercel-frontend-validation.yml"
  push:
    branches:
      - codex/vercel-supabase-production-prep
    paths:
      - "aria-frontend/**"
      - ".github/workflows/vercel-frontend-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aria-frontend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aria
      JWT_SECRET: ci-only-placeholder-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AI_ORCHESTRATION_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-only-placeholder-service-role-key
      OPENAI_API_KEY: ci-only-placeholder-openai-key
      OPENAI_MODEL: gpt-4o-mini
      ANTHROPIC_API_KEY: ci-only-placeholder-anthropic-key
      NEXT_PUBLIC_PREVIEW_MODE: "true"
      NEXT_PUBLIC_AI_REQUEST_TIMEOUT_MS: "45000"
      NEXT_PUBLIC_AI_REQUEST_RETRIES: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aria-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check secret exposure
        run: npm run security:secrets

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate
        run: npm run validate
